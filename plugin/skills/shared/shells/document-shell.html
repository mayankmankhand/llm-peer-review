<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Summary</title>
<!--
  document-shell.html - prebuilt HTML shell for /document's cycle summary.

  Rendered by .claude/scripts/render-html.js, which inlines two things:
    1. tokens.css  -> the tokens slot inside the <style> block below
    2. the JSON payload -> the render-data block (the application/json data
       island carrying id="render-data") further down in <body>
  (Each slot's literal placeholder token appears EXACTLY ONCE in this file, at
  its real injection point - the helper does a first-occurrence replace, so this
  doc must not repeat those tokens verbatim.)
  The result is a single self-contained file (inline CSS + JSON + renderer JS),
  no CDN, works offline on file://. Reproduces the gold look of
  artifacts/html/document-2026-06-08.html.

  ==========================================================================
  JSON SCHEMA (the /document command produces this; the renderer consumes it)
  ==========================================================================
  All fields optional unless noted; a section is skipped when its data is
  missing or empty. Inline trusted HTML (Claude-generated cycle text) is
  allowed in: subtitle, whatShipped, each file's "note", each docDelta's
  "note", and the prNote. Those render via innerHTML. Emoji are literal.

  {
    "title":   "Cycle Summary",                  // h1 text (defaults to "Cycle Summary")
    "pill":    "v5.0.1",                          // optional version pill beside the h1

    // Subtitle line under the title. Plain cycle window + meta. HTML allowed
    // (e.g. <code>a82e755..dfe7e39</code>, &middot;). If omitted, built from
    // "window" + "commitCount" + "issues" when those are present instead.
    "subtitle":    "2026-06-08 &middot; window <code>a82e755..dfe7e39</code> (1 commit)",
    "window":      "a82e755..dfe7e39",           // used only if subtitle is absent
    "commitCount": 1,                            // used only if subtitle is absent
    "issues":      ["#119", "#126"],             // used only if subtitle is absent

    // ---- the narrative (the page's first screen, issue #163) ----
    // Three parts, rendered in this order under "Before" / "What changed" /
    // "Why". Each is optional and a missing one is skipped, not stubbed. HTML
    // allowed in all three. They lead the page; the file inventory follows.
    "priorState":  "Every /document run wrote a new timestamped page ...",
    "whatShipped": "Two reliability fixes. <strong>#119</strong> ...",
    "why":         "A new page every run is a backlog ...",   // route CHANGELOG's "### Why"

    // Running log of earlier cycles, carried forward by render-html.js from the
    // page this render replaces (stable mode only) and capped there. /document
    // does not author it. date and pill are plain text; line allows HTML.
    "cycleLog": [
      { "date": "2026-09-03", "pill": "v6.3.1", "line": "The page that can go empty" }
    ],

    // Optional inline SVG for the cycle's flow. Rendered ONLY when it is a
    // string beginning with <svg that parses as SVG; anything else is silently
    // dropped, because this is the one model-authored markup field on the page.
    // Most cycles omit it. No CDN, no library - the shell is offline-only.
    "diagram": "<svg viewBox=\"0 0 600 120\" ...>...</svg>",

    // Set by render-html.js in stable mode ("Since you last opened this page:
    // ..."). NEVER authored by /document; a supplied value is overwritten.
    "sinceLast": "Since you last opened this page: 19 commits across 2 cycles.",

    // Files changed by category. Keys are category labels; each value is an
    // array of files. A file is either a plain string (path) or an object
    // { "status":"new"|"mod"|"del", "path":"...", "note":"(version stamp)" }.
    // status -> NEW (green) / MOD (yellow) / DEL (red) tag; default MOD.
    // note (HTML allowed) renders muted after the path. Empty categories skip.
    // Canonical category order: commands, skills, scripts, docs - then any
    // extra keys in the order given. Provided keys with a friendly label win.
    "filesByCategory": {
      "scripts": [
        { "status":"new", "path":".claude/scripts/open-artifact.sh" },
        { "status":"mod", "path":"scripts/setup/setup.sh" }
      ],
      "docs": [ "CHANGELOG.md", "LESSONS.md" ]
    },

    // Documentation deltas - one line each for the docs that changed. file is
    // the bold doc name; note (HTML allowed) is the one-line description.
    "docDeltas": [
      { "file":"CHANGELOG.md", "note":"new <code>v5.0.1</code> section ..." },
      { "file":"README.md",    "note":"unchanged (the opener is internal)." }
    ],

    // PR / commit link section (the gold's second .meta-card). All optional;
    // the whole section is skipped if prLink AND prNote are both absent.
    "prLink": "https://github.com/owner/repo/pull/42",   // href
    "prText": "#42",                                      // visible link text (defaults to prLink)
    "prNote": "Commit <a href='...'>dfe7e39</a> - pushed to <code>main</code>.", // HTML allowed

    // Mini commit chart - one bar per day across the window. count drives the
    // bar height (tallest = the max count). date is the x-axis label. The chart
    // renders inside the PR section card when present, else on its own.
    "commitChart": [
      { "date":"2026-06-06", "count":2 },
      { "date":"2026-06-07", "count":0 },
      { "date":"2026-06-08", "count":1 }
    ],

    // Footer line (HTML allowed). Defaults to the standard /document note.
    "footer": "Generated by /document. Markdown remains the source of truth ..."
  }

  File-reference rendering (shared convention, available via fileLink() but the
  document summary mostly shows bare paths): <a class="file-link"
    href="vscode://file/<absPath>[:<line>]"><relPath>[:<line>]</a>.
  ==========================================================================
-->
<style>
/*__TOKENS__*/

/* ---- document-specific layout (everything NOT already in tokens.css) ---- */
header.page{padding:2rem 0 .5rem;}
/* The cycle's name is the loudest thing on the page, and the only element taking
   --text-display: a second one would mean neither is loudest (html-look.md).
   It is the h1 itself rather than a separate banner, so the page keeps one
   heading and a screen reader hears the cycle name first (issue #163). */
h1.display{margin:0 0 .3rem;}
h1 .pill{display:inline-block;font-size:.78rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);vertical-align:middle;margin-left:.5rem;} /* tinted, not --bg-muted (holistic review, R30) */
.sub{color:var(--text-muted);font-size:.9rem;margin:.2rem 0 0;max-width:var(--measure);}

/* "Since you last opened this page" - renderer-set, never authored by /document.
   Sits directly under the header because orientation comes before content. */
.since-last{color:var(--text-muted);font-size:.95rem;margin:.7rem 0 0;max-width:var(--measure);}

/* The narrative: the three questions a reader opens this page to answer, in the
   order they are asked. This is the page's first screen, above the mechanical
   inventory that used to own the layout (issue #163). */
.narrative{margin:1.7rem 0 0;}
.narr{margin:0 0 1.2rem;max-width:var(--measure);}
/* h2, not h3: these are real sections of the page, at the same level as "Earlier
   cycles" below, and an h3 straight after the h1 skips a level (axe heading-order).
   Visual weight and semantic level are allowed to differ - these labels stay quiet
   on purpose so the prose leads the first screen. */
.narr h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:0 0 .3rem;font-weight:600;}
.narr p{margin:0;}

/* Optional inline SVG, rendered only when the cycle has a flow worth drawing.
   Scrolls inside its own box rather than widening the page. */
.diagram{margin:1.5rem 0 0;overflow-x:auto;}
/* fill follows the theme (review of this cycle, R12). SVG's initial fill is black
   with no inheritance from the page's text color, so a diagram authored without
   explicit colors - the likely shape, since the authoring instruction says nothing
   about color - painted black on the dark ground and disappeared. fill is an
   inherited SVG property, so setting it on the root reaches every shape and every
   <text> that did not set its own, and leaves explicitly coloured ones alone.
   stroke is deliberately NOT set: its initial value is none, so inheriting a colour
   would draw outlines the author never asked for. */
.diagram svg{max-width:100%;height:auto;display:block;color:var(--text);fill:currentColor;}

/* Earlier cycles - the running log carried forward from the page this replaces.
   One line each: this is history, so it stays compact and never competes with
   the current cycle above it. */
.log{list-style:none;margin:.3rem 0 0;padding:0;}
.log li{display:flex;gap:.7rem;align-items:baseline;padding:.45rem 0;border-top:1px solid var(--border);font-size:.9rem;max-width:var(--measure);}
.log li:first-child{border-top:0;}
.log-when,.log-pill{color:var(--text-muted);font-family:ui-monospace,Consolas,monospace;font-size:.78rem;flex:none;}
.log-when{min-width:5.5rem;}

/* The underline rule is gone (design critic, round 1). It spanned the full 940px
   over a 64ch text column, which left the right third empty and made a composed
   page read as an unstyled document. Capping it to --measure does not work either:
   ch is relative to the element's OWN font-size, so the same token resolves wider
   on a 1.25rem heading than on 1rem prose. Space separates the sections instead,
   which is one less thing on the screen (design-rules.md, Technique 6). */
h2{font-size:1.25rem;margin:2.6rem 0 .7rem;}
/* The first section after the narrative gets extra air, so the page separates
   "this cycle's story" from the mechanical record rather than running them
   together at one rhythm (design critic, round 1). */
.narrative + h2{margin-top:3.4rem;}
/* The diagram already carries its own space above and below, so it does not also
   take the extra section gap - stacking both left a ~120px void that read as a
   break in the page (design critic, round 2). */
.diagram + h2{margin-top:2.2rem;}
/* Lines inside a callout card stack as blocks; see the prNote comment below. */
.card-line{margin:0 0 .4rem;}
.card-line:last-child{margin-bottom:0;}

/* Callout card - now only the PR/commit block. "What shipped" left this card in
   issue #163 and became plain narrative prose: the card was a container holding
   nothing the layout needed, and it made the page's most important paragraph
   look like an aside (design-rules.md, Technique 6). */
.meta-card{background:var(--bg-muted);border:1px solid var(--border);border-radius:8px;padding:.9rem 1.1rem;font-size:.9rem;margin-bottom:.5rem;max-width:var(--measure);}

/* Files-by-category. */
.cat{margin-bottom:1rem;}
.cat h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:0 0 .35rem;font-weight:600;}
.files{display:flex;flex-direction:column;gap:.25rem;}
.file-row{display:flex;align-items:center;gap:.5rem;font-family:ui-monospace,Consolas,monospace;font-size:.83rem;}
.file-note{color:var(--text-muted);font-family:system-ui,-apple-system,sans-serif;}
.tag{font-size:.68rem;font-weight:700;padding:.05rem .4rem;border-radius:3px;width:2.4rem;text-align:center;flex:none;}
/* Status tags sit on their own tint, not on --bg-muted, which the dark-mode
   sweep had flattened them to (holistic review, R30). Each text-on-tint
   pairing clears AA in both palettes; see tokens.css for the numbers. */
.tag-new{background:var(--positive-soft);color:var(--positive);}
.tag-mod{background:var(--warn-soft);color:var(--warn-strong);}
.tag-del{background:var(--block-soft);color:var(--block-strong);}

/* Documentation deltas list. */
.deltas{margin:.3rem 0;padding-left:1.2rem;}
.deltas li{margin-bottom:.3rem;max-width:var(--measure);}

/* Mini commit chart - small inline bars. */
/* min-height, not height: a 55px bar plus a two-line label is taller than 70px,
   and a fixed height with align-items:flex-end pushed the overflow UPWARD, so the
   bars were painted over the note above the chart (design critic, round 1). */
.chart{display:flex;align-items:flex-end;gap:.5rem;min-height:70px;padding:.5rem 0;margin-top:.6rem;}
.bar-wrap{display:flex;flex-direction:column;align-items:center;gap:.3rem;}
.bar{width:30px;min-height:2px;background:var(--accent);border-radius:3px 3px 0 0;}
.bar--zero{background:var(--border);}
.bar-label{font-size:.7rem;color:var(--text-muted);font-family:ui-monospace,Consolas,monospace;text-align:center;line-height:1.2;}

footer.note{margin-top:2rem;border-top:1px solid var(--border);padding-top:.8rem;font-size:.8rem;color:var(--text-muted);}
.noscript-note{color:var(--text-muted);font-size:.9rem;padding:1rem 0;}
</style>
</head>
<body>

<noscript>
  <p class="noscript-note">This report needs JavaScript to render. Its data is in this file's source, or open the canonical markdown version.</p>
</noscript>

<script type="application/json" id="render-data">__RENDER_DATA__</script>

<script>
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("render-data").textContent);

  // ---- tiny DOM helpers -------------------------------------------------
  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }
  // Trusted inline HTML (Claude-generated cycle text, not untrusted input).
  function html(node, markup) { node.innerHTML = (markup == null ? "" : String(markup)); return node; }
  function text(node, str)    { node.textContent = (str == null ? "" : String(str));   return node; }
  function isArr(x)           { return Object.prototype.toString.call(x) === "[object Array]"; }
  function nonEmpty(x)        { return isArr(x) && x.length > 0; }
  function isStr(x)           { return typeof x === "string" && x.length > 0; }

  var body = el("main"); // all rendered output lives in one <main> landmark (a11y)

  // ---- header.page (title + pill, subtitle) -----------------------------
  var header = el("header", "page");
  var h1 = el("h1", "display"); // the cycle's name, and the page's one display element
  text(h1, data.title || "Cycle Summary");
  if (isStr(data.pill)) {
    var pill = el("span", "pill");
    text(pill, data.pill);
    h1.appendChild(document.createTextNode(" "));
    h1.appendChild(pill);
  }
  header.appendChild(h1);

  // Subtitle: explicit subtitle wins; else assemble from window/count/issues.
  var subMarkup = isStr(data.subtitle) ? data.subtitle : buildSubtitle(data);
  if (subMarkup) {
    var sub = el("p", "sub");
    html(sub, subMarkup); // may carry inline HTML (e.g. <code>, &middot;)
    header.appendChild(sub);
  }
  // "Since you last opened this page" - set by render-html.js in stable mode,
  // never authored by /document. Orientation comes before content.
  if (isStr(data.sinceLast)) {
    var sl = el("p", "since-last");
    text(sl, data.sinceLast);
    header.appendChild(sl);
  }
  body.appendChild(header);

  // ---- the narrative (first screen) -------------------------------------
  // Before / What changed / Why, in the order a reader asks them. This is what
  // the page is for; everything below it is the mechanical record (issue #163).
  var narrative = el("div", "narrative");
  [
    { key: "priorState",  label: "Before" },
    { key: "whatShipped", label: "What changed" },
    { key: "why",         label: "Why" }
  ].forEach(function (part) {
    if (!isStr(data[part.key])) return;      // a missing part is skipped, not stubbed
    var block = el("div", "narr");
    var lbl = el("h2");                       // h2 keeps the heading order valid
    text(lbl, part.label);
    block.appendChild(lbl);
    var p = el("p");
    html(p, data[part.key]);                 // trusted inline HTML
    block.appendChild(p);
    narrative.appendChild(block);
  });
  if (narrative.childNodes.length) body.appendChild(narrative);

  // ---- diagram (optional) -----------------------------------------------
  var diagram = renderDiagram(data.diagram);
  if (diagram) body.appendChild(diagram);

  // ---- earlier cycles (the running log) ---------------------------------
  if (nonEmpty(data.cycleLog)) {
    body.appendChild(sectionHeading("Earlier cycles"));
    var log = el("ul", "log");
    data.cycleLog.forEach(function (entry) {
      if (!entry) return;
      var li = el("li");
      if (isStr(entry.date)) {
        var when = el("span", "log-when");
        text(when, entry.date);
        li.appendChild(when);
      }
      if (isStr(entry.pill)) {
        var lp = el("span", "log-pill");
        text(lp, entry.pill);
        li.appendChild(lp);
      }
      if (isStr(entry.line)) {
        var lt = document.createElement("span");
        html(lt, entry.line);                // trusted inline HTML
        li.appendChild(lt);
      }
      if (li.childNodes.length) log.appendChild(li);
    });
    if (log.childNodes.length) body.appendChild(log);
  }

  // ---- documentation deltas ---------------------------------------------
  if (nonEmpty(data.docDeltas)) {
    body.appendChild(sectionHeading("Documentation deltas"));
    var ul = el("ul", "deltas");
    data.docDeltas.forEach(function (d) {
      if (!d) return;
      var li = el("li");
      if (isStr(d.file)) {
        var strong = el("strong");
        text(strong, d.file);
        li.appendChild(strong);
        if (isStr(d.note)) li.appendChild(document.createTextNode(" - "));
      }
      if (isStr(d.note)) {
        var span = document.createElement("span");
        html(span, d.note); // inline HTML allowed
        li.appendChild(span);
      }
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  // ---- this cycle: PR / commit note + mini commit chart -----------------
  var hasPrLink  = isStr(data.prLink);
  var hasPrNote  = isStr(data.prNote);
  var hasChart   = nonEmpty(data.commitChart);
  if (hasPrLink || hasPrNote || hasChart) {
    body.appendChild(sectionHeading("This cycle"));
    var card = el("div", "meta-card");

    if (hasPrNote) {
      // A block, not a bare <span>: an inline note followed by the block-level
      // chart shared a line box, and the bars were drawn over the note's text
      // (design critic, round 1). A block box cannot be overlapped that way.
      var note = el("p", "card-line");
      html(note, data.prNote); // inline HTML allowed (may itself include a link)
      card.appendChild(note);
    }

    if (hasPrLink) {
      // Standalone PR link (when not already embedded in prNote markup).
      var prWrap = el("p", "card-line");
      prWrap.appendChild(document.createTextNode("PR: "));
      var a = el("a");
      a.setAttribute("href", data.prLink);
      text(a, isStr(data.prText) ? data.prText : data.prLink);
      prWrap.appendChild(a);
      card.appendChild(prWrap);
    }

    if (hasChart) card.appendChild(renderChart(data.commitChart));

    body.appendChild(card);
  }

  // ---- files changed by category ----------------------------------------
  // Last on purpose. This is the mechanical record: useful to check, but it used
  // to own the page's layout while the narrative sat in a small card above it,
  // which is the hierarchy issue #163 was filed about.
  var fbc = data.filesByCategory;
  if (fbc && typeof fbc === "object") {
    var order = orderedCategoryKeys(fbc);
    var sections = [];
    order.forEach(function (key) {
      var list = fbc[key];
      if (!nonEmpty(list)) return;
      sections.push(renderCategory(key, list));
    });
    if (sections.length) {
      body.appendChild(sectionHeading("Files changed by category"));
      sections.forEach(function (s) { body.appendChild(s); });
    }
  }

  // ---- footer -----------------------------------------------------------
  var footer = el("footer", "note");
  html(footer, isStr(data.footer)
    ? data.footer
    : "Generated by /document. Markdown remains the source of truth; this is the rendered cycle view.");
  body.appendChild(footer);

  document.body.appendChild(body); // attach the assembled <main> once

  // ====================================================================
  // builders
  // ====================================================================

  // Optional inline SVG for the cycle's flow. Unlike every other field, this one
  // is model-authored markup per run, so a malformed value must degrade to "no
  // diagram" and never take the rest of the page with it (issue #163).
  //
  // Three gates, cheapest first:
  //   1. a non-empty string that starts with <svg after trimming
  //   2. it parses as XML with no parser error
  //   3. the parsed root really is an <svg> element
  // Anything else returns null and the section is simply skipped.
  function renderDiagram(raw) {
    if (!isStr(raw)) return null;
    var src = raw.replace(/^\s+/, "");
    if (src.slice(0, 4).toLowerCase() !== "<svg") return null;

    var doc;
    try {
      doc = new DOMParser().parseFromString(src, "image/svg+xml");
    } catch (e) {
      return null;                                   // parser threw outright
    }
    if (!doc || doc.getElementsByTagName("parsererror").length) return null;

    var root = doc.documentElement;
    if (!root || String(root.nodeName).toLowerCase() !== "svg") return null;

    var wrap = el("figure", "diagram");
    wrap.appendChild(document.importNode(root, true)); // adopt the parsed node, not the raw string
    return wrap;
  }

  function buildSubtitle(d) {
    var parts = [];
    if (isStr(d.window)) {
      var w = "window <code>" + escapeHtml(d.window) + "</code>";
      if (d.commitCount != null && d.commitCount !== "") {
        var n = Number(d.commitCount);
        w += " (" + d.commitCount + " commit" + (n === 1 ? "" : "s") + ")";
      }
      parts.push(w);
    }
    if (nonEmpty(d.issues)) {
      parts.push("issues " + d.issues.join(", "));
    }
    return parts.length ? parts.join(" &middot; ") : "";
  }

  // Canonical order first (commands, skills, scripts, docs), then any extras
  // in their given object order. Filters to keys actually present in the data.
  function orderedCategoryKeys(obj) {
    var canonical = ["commands", "skills", "scripts", "docs"];
    var keys = [];
    canonical.forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) keys.push(k);
    });
    Object.keys(obj).forEach(function (k) {
      if (canonical.indexOf(k) === -1) keys.push(k);
    });
    return keys;
  }

  // Title-case a category key for the <h3> label (e.g. "scripts" -> "Scripts").
  function categoryLabel(key) {
    if (!isStr(key)) return "";
    return key.charAt(0).toUpperCase() + key.slice(1);
  }

  function renderCategory(key, list) {
    var cat = el("div", "cat");
    var h3 = el("h3");
    text(h3, categoryLabel(key));
    cat.appendChild(h3);

    var files = el("div", "files");
    list.forEach(function (item) {
      if (item == null) return;
      var row = el("div", "file-row");

      // Normalize: string -> { path }, object -> as given.
      var status, path, fileNote;
      if (typeof item === "string") {
        status = "mod"; path = item; fileNote = null;
      } else {
        status = isStr(item.status) ? item.status.toLowerCase() : "mod";
        path = item.path != null ? String(item.path) : "";
        fileNote = isStr(item.note) ? item.note : null;
      }

      var tagCls = "tag-mod", tagText = "MOD";
      if (status === "new") { tagCls = "tag-new"; tagText = "NEW"; }
      else if (status === "del" || status === "deleted") { tagCls = "tag-del"; tagText = "DEL"; }

      var tag = el("span", "tag " + tagCls);
      text(tag, tagText);
      row.appendChild(tag);

      var pathSpan = document.createElement("span");
      text(pathSpan, path);
      row.appendChild(pathSpan);

      if (fileNote) {
        row.appendChild(document.createTextNode(" "));
        var noteSpan = el("span", "file-note");
        html(noteSpan, fileNote); // inline HTML allowed
        row.appendChild(noteSpan);
      }

      files.appendChild(row);
    });
    cat.appendChild(files);
    return cat;
  }

  function renderChart(rows) {
    var max = 0;
    rows.forEach(function (r) {
      if (r && Number(r.count) > max) max = Number(r.count);
    });
    var maxPx = 55; // tallest bar, matches the gold artifact

    var chart = el("div", "chart");
    // a11y: the bars are visual-only, so summarize the whole series as a text
    // label (WCAG 1.1.1) - a screen reader announces this instead of empty bars.
    chart.setAttribute("role", "img");
    var summaryParts = rows.filter(function (r) { return r && isStr(r.date); })
      .map(function (r) { return (Number(r.count) || 0) + " on " + r.date; });
    chart.setAttribute("aria-label", "Commits per day: " + (summaryParts.length ? summaryParts.join(", ") : "none"));
    rows.forEach(function (r) {
      if (!r) return;
      var count = Number(r.count) || 0;
      var wrap = el("div", "bar-wrap");
      var bar = el("div", "bar" + (count === 0 ? " bar--zero" : ""));
      var h = (max > 0 && count > 0) ? Math.max(2, Math.round((count / max) * maxPx)) : 2;
      bar.style.height = h + "px";
      wrap.appendChild(bar);

      var label = el("div", "bar-label");
      // Show MM-DD on the first line, count on the second (gold look).
      var dateLabel = shortDate(r.date);
      html(label, escapeHtml(dateLabel) + "<br>" + escapeHtml(String(count)));
      wrap.appendChild(label);

      chart.appendChild(wrap);
    });
    return chart;
  }

  // "2026-06-08" -> "06-08"; leaves any other format untouched.
  function shortDate(d) {
    if (!isStr(d)) return "";
    var m = d.match(/^\d{4}-(\d{2}-\d{2})$/);
    return m ? m[1] : d;
  }

  function sectionHeading(label) {
    var h2 = el("h2");
    text(h2, label);
    return h2;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // file reference -> clickable vscode:// link (shared convention). Unused by
  // the default summary layout but available for any file-link callers.
  function fileLink(file) { // eslint-disable-line no-unused-vars
    if (!file || (!file.relPath && !file.absPath)) return null;
    var rel = file.relPath || file.absPath;
    var hasLine = file.line != null && file.line !== "";
    var visible = rel + (hasLine ? ":" + file.line : "");
    // No absPath means the payload was rendered with --no-abs, i.e. this page is
    // destined for a hosted viewer (issue #155 item 2). A vscode://file/ link
    // built from the RELATIVE path would not leak anything, but it is dead for
    // every viewer, so render the reference as plain text instead of a link.
    if (!file.absPath) {
      var span = el("span", "file-link");
      text(span, visible);
      return span;
    }
    var a = el("a", "file-link");
    a.setAttribute("href", "vscode://file/" + file.absPath + (hasLine ? ":" + file.line : ""));
    text(a, visible);
    return a;
  }
})();
</script>
