name: Bug report
description: Something in the toolkit did not work the way it should.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Short answers are fine.
        Found a security problem? Please do not file it here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did you see? Paste any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Toolkit version
      description: The session start line prints it, or run `cat .claude/.toolkit-state.json` in your project.
      placeholder: "7.6.1"
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - Claude Code
        - Cursor
        - Codex
        - Other
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - WSL
        - Windows
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Screenshots, logs, or anything that might help.
    validations:
      required: false
