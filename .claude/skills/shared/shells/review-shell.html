<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review</title>
<!--
  review-shell.html - prebuilt HTML shell for /review and the /review-* family.

  Rendered by .claude/scripts/render-html.js, which inlines two things:
    1. tokens.css  -> the tokens slot inside the <style> block below
    2. the JSON payload -> the render-data block (the application/json
       data island carrying id="render-data") further down in <body>
  (Each slot's literal placeholder token appears EXACTLY ONCE in this file, at
  its real injection point - the helper does a first-occurrence replace, so this
  doc must not repeat those tokens verbatim.)
  The result is a single self-contained file (inline CSS + JSON + renderer JS),
  no CDN, works offline on file://. Reproduces the gold look of
  artifacts/html/review-orchestrator-2026-06-08.html.

  ==========================================================================
  JSON SCHEMA (the slash commands produce this; the renderer below consumes it)
  ==========================================================================
  All fields optional unless noted; a section is skipped when its data is
  missing or empty. Severity is the string "block" | "warn" | "suggest".

  THE FINDING CONTRACT (issue #161). A finding is prose in three keys - "what",
  "context", "fix" - plus non-prose attachments. render-html.js counts the words
  in those three, ranks the findings by locus, and demotes the lowest-ranked to
  one-line rows once the page budget is spent. It also refuses the retired
  four-field labels (Why it matters / Example / Suggested fix) by dropping them
  and naming the refusal on stderr; it does not abort, because a rejected render
  would leave a run with no artifact at all. Do not put prose in "fields" to get
  around the caps: attachments are not counted, and that is the one evasion this
  contract cannot catch by counting.
  Inline trusted HTML (Claude-generated review text) is allowed in: looksGood
  items, a finding's "what", and every field "value". Those render via
  innerHTML. Emoji in the JSON are literal (rendered directly).

  {
    "title":    "Orchestrator Review",          // h1 (required-ish; defaults to "Review")
    "subtitle": "#119 ... &middot; 2026-06-08", // p.sub under the title (HTML allowed)

    // Specialist chips. on:true -> "<name>"      (class "chip on")
    //                   on:false -> "<name> (skipped)" (class "chip")
    // Omit/empty the array to hide the chip row (e.g. single-specialist run).
    "chips": [ {"name":"code","on":true}, {"name":"ux","on":false} ],

    // Sticky top-issues bar. Each key is an array of entry strings.
    // A row always renders for all three severities (shows the count, e.g.
    // "0 Blocks"); when the array is non-empty it appends ": " + comma-joined
    // entries. Omit topIssues entirely to hide the whole bar.
    "topIssues": {
      "block":   ["R1 [code] (file.sh:91 - desc)"],
      "warn":    ["R2 [code]"],
      "suggest": ["R3 [code]", "R4 [commands]"]
    },

    // Looks-good callout box. Items may contain inline HTML.
    "looksGood": [ "<strong>The core approach is right.</strong> ..." ],

    // Findings, grouped by specialist. Each group renders a .group-label then
    // its finding cards. (Flat top-level "findings" array also accepted as a
    // fallback for single-specialist runs - see renderer.)
    "groups": [
      {
        "label": "code",
        "findings": [
          {
            "id":         "R1",
            "severity":   "warn",                 // block | warn | suggest
            "specialist": "code",                 // shown as [code]; defaults to group label
            "file": { "relPath": ".claude/scripts/open-artifact.sh",
                      "absPath": "/home/.../open-artifact.sh",
                      "line": 91 },               // line optional; file optional
            "what": "Sentence one: severity spelled out, defect, harm verb (HTML allowed).",
            "context": "Sentence two. OMIT THE KEY unless it answers who is hit,
                        when it fires, or why now. Omitted is the normal case.",
            "fix":     "The fix line: a cost and a choice, not an approach.",
            "locus":   "user",                     // optional. "user" = only the
                                                   // human can answer this. Drives
                                                   // ranking; severity breaks ties.
            "demoted": false,                      // set by render-html.js, never
                                                   // by the payload. A demoted
                                                   // finding renders as its
                                                   // headline alone.
            "receipt": {                           // the check's OWN output
              "cmd":    "node .claude/scripts/pre-push-check.js",
              "stdout": ["line", "line"],          // filled by render-html.js from
                                                   // receipt.stdoutFile, which the
                                                   // tier-1 runner writes. Rendered
                                                   // via textContent, so it may
                                                   // contain any characters at all.
              "exit":   1
            },
            "fields": [                            // ATTACHMENTS ONLY, in order.
                                                   // Most findings emit none.
              // Browser findings use, in this order:
              // { "label": "Expected",   "value": "..." },
              // { "label": "Actual",     "value": "..." },
              // { "label": "Screenshot", "value": "<img src='...' alt='...'>" },
              // { "label": "Evidence",   "value": "<pre>console errors</pre>" }
            ]
          }
        ]
      }
    ],

    // Footer count strip. Each span = optional emoji + bold label + value.
    "summary": [
      { "emoji": "",  "label": "Specialists run", "value": "3 of 3 (4 auto-skipped)" },
      { "emoji": "",  "label": "Files reviewed",  "value": "6" },
      { "emoji": "🚫", "label": "Blocks",          "value": "0" },
      { "emoji": "⚠️", "label": "Warns",           "value": "2" },
      { "emoji": "💡", "label": "Suggests",        "value": "5" },
      { "emoji": "",  "label": "Deduplicated",    "value": "7 (8 raw)" }
    ]
  }

  File-reference rendering: <a class="file-link"
    href="vscode://file/<absPath>[:<line>]"><relPath>[:<line>]</a>.
  Visible text = relPath (+ :line if present). The href uses absPath; when absPath
  is absent (a --no-abs render, i.e. a page bound for a hosted viewer) the
  reference renders as PLAIN TEXT rather than a link, because an editor link
  built from a relative path is dead for every viewer.
  ==========================================================================
-->
<style>
/*__TOKENS__*/

/* ---- review-specific layout (everything NOT already in tokens.css) ---- */
header.page{padding:2rem 0 1rem;border-bottom:1px solid var(--border);}
.sub{color:var(--text-muted);font-size:.9rem;margin:.2rem 0 0;}
.chips{margin-top:.8rem;display:flex;gap:.4rem;flex-wrap:wrap;}
.chip{font-family:ui-monospace,Consolas,monospace;font-size:.75rem;background:var(--bg-muted);border:1px solid var(--border);color:var(--text-muted);padding:.2rem .55rem;border-radius:999px;}
/* An "on" chip sits on its own tint with an accent ring. The dark-mode sweep
   had flattened it to --bg-muted, leaving it .chip plus a text color
   (holistic review, R30). --accent on --accent-soft clears AA in both palettes. */
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.top-issues{position:sticky;top:0;background:var(--bg);padding:.8rem 0;border-bottom:1px solid var(--border);z-index:10;max-height:40vh;overflow-y:auto;}
.top-row{font-size:.9rem;padding:.15rem 0;}
.top-row--block{color:var(--block);font-weight:600;}
.top-row--warn{color:var(--warn-strong);font-weight:600;}
.top-row--suggest{color:var(--suggest);}
.looks-good{background:var(--bg-muted);border:1px solid var(--border);border-left:4px solid var(--positive);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem;}
.looks-good h2{margin:0 0 .5rem;font-size:1rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
.looks-good ul{margin:0;padding-left:1.1rem;}
.looks-good li{margin-bottom:.35rem;}
.group-label{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:1.6rem 0 .6rem;}
.noscript-note{color:var(--text-muted);font-size:.9rem;padding:1rem 0;}

/* ---- the two-sentence contract (issue #161) ---- */
/* Sentence two. Unlabeled, one step down from the headline, and given real
   space above it so the eye reads it as a continuation rather than a field. */
.context{margin:.45rem 0 0;font-size:.95rem;color:var(--text);}
/* The fix line closes every finding, so it gets separation from what precedes it. */
.field.fix{margin-top:.7rem;}
/* The receipt is the ONE tinted, monospaced surface on a finding. That single
   visual exception is load-bearing: it is how the reader tells the machine's
   words from the reviewer's. Everything here is defensive against real command
   output - long lines scroll inside the block rather than pushing the page
   sideways, and the content arrives via textContent so nothing in it is parsed. */
.receipt{margin:.7rem 0 0;background:var(--bg-muted);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.receipt-label{font-family:ui-monospace,Consolas,monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:.4rem .8rem 0;}
.receipt pre{margin:0;padding:.4rem .8rem .6rem;overflow-x:auto;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;line-height:1.5;white-space:pre;color:var(--text);}
/* tokens.css styles inline `code` with a background and padding; inside a <pre>
   that would paint a stray pill around nested spans. There are none here today
   (textContent cannot produce them) - this is a guard for the day something
   renders a code span into a receipt. */
.receipt pre code{background:none;padding:0;font-size:inherit;}
/* A demoted finding: present, countable, and quiet. It carries its headline and
   nothing else, because the page budget was spent on findings ranked above it.
   Rendered flat rather than as a card so the eye reads the open findings as the
   page's content and these as its tail. */
.finding--demoted{padding:.45rem .9rem;margin-bottom:.35rem;border-left-width:3px;background:none;}
.finding--demoted .what{font-size:.92rem;font-weight:400;color:var(--text-muted);margin:.2rem 0 0;}
.finding--demoted .badge{font-size:.66rem;}
/* Attachment safety: an <img> or a wide <pre> arriving through a field value
   must never push the page sideways. Neither had a rule before (issue #161). */
.field img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:6px;display:block;margin:.4rem 0;}
.field pre{margin:.4rem 0;padding:.5rem .7rem;background:var(--bg-muted);border:1px solid var(--border);border-radius:6px;overflow-x:auto;white-space:pre;font-size:.8rem;}
</style>
</head>
<body>

<noscript>
  <p class="noscript-note">This report needs JavaScript to render. Its data is in this file's source, or open the canonical markdown version.</p>
</noscript>

<script type="application/json" id="render-data">__RENDER_DATA__</script>

<script>
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("render-data").textContent);

  var SEV = {
    block:   { label: "Block",   emoji: "🚫" }, /* 🚫 */
    warn:    { label: "Warn",    emoji: "⚠️" },  /* ⚠️ */
    suggest: { label: "Suggest", emoji: "💡" }   /* 💡 */
  };

  // ---- tiny DOM helpers -------------------------------------------------
  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }
  // Trusted inline HTML (Claude-generated review text, not untrusted input).
  function html(node, markup) { node.innerHTML = (markup == null ? "" : String(markup)); return node; }
  function text(node, str)    { node.textContent = (str == null ? "" : String(str));   return node; }
  function isArr(x)           { return Object.prototype.toString.call(x) === "[object Array]"; }
  function nonEmpty(x)        { return isArr(x) && x.length > 0; }

  // All rendered output lives inside a <main> landmark (a11y: one main region
  // per page). We build into "body" (the main element) and attach it once at the
  // end. Keeping the variable name "body" leaves the rest of the renderer
  // untouched; only the container element changed from document.body to <main>.
  var body = el("main");

  // ---- header.page (title, subtitle, chips) -----------------------------
  var header = el("header", "page");
  var h1 = el("h1");
  text(h1, data.title || "Review");
  header.appendChild(h1);

  if (data.subtitle) {
    var sub = el("p", "sub");
    html(sub, data.subtitle); // subtitle may carry inline HTML (e.g. &middot;)
    header.appendChild(sub);
  }

  if (nonEmpty(data.chips)) {
    var chips = el("div", "chips");
    data.chips.forEach(function (c) {
      if (!c || !c.name) return;
      var chip;
      if (c.on) {
        chip = el("span", "chip on");
        text(chip, c.name);
      } else {
        chip = el("span", "chip");
        text(chip, c.name + " (skipped)");
      }
      chips.appendChild(chip);
    });
    if (chips.childNodes.length) header.appendChild(chips);
  }
  body.appendChild(header);

  // ---- top-issues (sticky) ----------------------------------------------
  if (data.topIssues) {
    var ti = data.topIssues;
    var rows = [
      { key: "block",   word: "Blocks"   },
      { key: "warn",    word: "Warns"    },
      { key: "suggest", word: "Suggests" }
    ];
    var sec = el("section", "top-issues");
    rows.forEach(function (r) {
      var entries = isArr(ti[r.key]) ? ti[r.key] : [];
      var row = el("div", "top-row top-row--" + r.key);
      var line = SEV[r.key].emoji + " " + entries.length + " " + r.word;
      if (entries.length > 0) line += ": " + entries.join(", ");
      text(row, line);
      sec.appendChild(row);
    });
    body.appendChild(sec);
  }

  // ---- looks-good -------------------------------------------------------
  if (nonEmpty(data.looksGood)) {
    var lg = el("section", "looks-good");
    var lgh = el("h2");
    text(lgh, "Looks Good");
    lg.appendChild(lgh);
    var ul = el("ul");
    data.looksGood.forEach(function (item) {
      var li = el("li");
      html(li, item); // inline HTML allowed
      ul.appendChild(li);
    });
    lg.appendChild(ul);
    body.appendChild(lg);
  }

  // ---- findings ---------------------------------------------------------
  // Accept either grouped (data.groups) or a flat data.findings fallback.
  var groups = [];
  if (nonEmpty(data.groups)) {
    groups = data.groups;
  } else if (nonEmpty(data.findings)) {
    groups = [{ label: null, findings: data.findings }];
  }

  var hasFindings = groups.some(function (g) { return g && nonEmpty(g.findings); });

  if (hasFindings) {
    var fh = el("h2");
    text(fh, "Findings");
    body.appendChild(fh);

    groups.forEach(function (group) {
      if (!group || !nonEmpty(group.findings)) return;

      if (group.label) {
        // h2 (not div) so the group label is a heading for SR navigation. The
        // .group-label class outranks the bare h2 rule, so the look is unchanged.
        var gl = el("h2", "group-label");
        text(gl, group.label);
        body.appendChild(gl);
      }

      group.findings.forEach(function (f) {
        if (!f) return;
        var sev = SEV[f.severity] ? f.severity : "suggest";
        var meta = SEV[sev];

        var card = el("article", "finding finding--" + sev);

        // card header: badge, id, specialist tag, file link
        var cardHead = el("header");

        var badge = el("span", "badge badge--" + sev);
        text(badge, meta.emoji + " " + meta.label);
        cardHead.appendChild(badge);

        if (f.id) {
          var idSpan = el("span", "finding-id");
          text(idSpan, f.id);
          cardHead.appendChild(idSpan);
        }

        var tag = f.specialist != null ? f.specialist : group.label;
        if (tag) {
          var tagSpan = el("span", "specialist-tag");
          text(tagSpan, "[" + tag + "]");
          cardHead.appendChild(tagSpan);
        }

        if (f.file && (f.file.relPath || f.file.absPath)) {
          cardHead.appendChild(fileLink(f.file));
        }

        card.appendChild(cardHead);

        // what (one-line summary) - rendered as an h3 so screen-reader heading
        // navigation can jump between findings. The .what class (specificity
        // beats the bare h3 element rule) preserves the look.
        if (f.what) {
          var what = el("h3", "what");
          html(what, f.what); // inline HTML allowed
          card.appendChild(what);
        }

        // A demoted finding stops here: severity, id, location and its first
        // sentence, and nothing else. render-html.js sets the flag when the page
        // budget is spent (issue #161). Demotion is not omission - the finding is
        // still on the page, and the markdown on disk still carries it in full.
        if (f.demoted) {
          card.className += " finding--demoted";
          body.appendChild(card);
          return;
        }

        // context (sentence two) - unlabeled on purpose. It earns its place by
        // answering who is hit, when it fires, or why now; a label would only
        // repeat what the sentence already says.
        if (f.context) {
          var ctx = el("p", "context");
          html(ctx, f.context);
          card.appendChild(ctx);
        }

        // receipt - the check's own output. TEXTCONTENT, never innerHTML: this
        // is machine output, and machine output is made of the characters
        // innerHTML eats. A probe render through the old field path deleted
        // "<anonymous>" from the page outright and let "if (a<b)" swallow
        // everything to the next ">". textContent makes both safe by
        // construction, which is why the receipt has its own slot rather than
        // riding fields[] (issue #161).
        if (f.receipt && (f.receipt.cmd || nonEmpty(f.receipt.stdout))) {
          var box = el("div", "receipt");
          var label = el("div", "receipt-label");
          text(label, "What I ran");
          box.appendChild(label);
          var pre = el("pre");
          var lines = [];
          if (f.receipt.cmd) lines.push("$ " + f.receipt.cmd);
          if (nonEmpty(f.receipt.stdout)) lines = lines.concat(f.receipt.stdout);
          if (f.receipt.exit != null) lines.push("exit " + f.receipt.exit);
          text(pre, lines.join("\n"));
          box.appendChild(pre);
          card.appendChild(box);
        }

        // attachment rows, in order (Expected / Actual / Screenshot / Evidence)
        if (nonEmpty(f.fields)) {
          f.fields.forEach(function (fld) {
            if (!fld || (fld.label == null && fld.value == null)) return;
            var row = el("div", "field");
            var strong = el("strong");
            text(strong, (fld.label != null ? fld.label : "") + ":");
            row.appendChild(strong);
            row.appendChild(document.createTextNode(" "));
            var span = document.createElement("span");
            html(span, fld.value); // value may carry inline HTML (incl <img>, <pre>)
            row.appendChild(span);
            card.appendChild(row);
          });
        }

        // fix line - a cost and a choice, always last
        if (f.fix) {
          var fixRow = el("div", "field fix");
          var fixLabel = el("strong");
          text(fixLabel, "Fix:");
          fixRow.appendChild(fixLabel);
          fixRow.appendChild(document.createTextNode(" "));
          var fixSpan = document.createElement("span");
          html(fixSpan, f.fix);
          fixRow.appendChild(fixSpan);
          card.appendChild(fixRow);
        }

        body.appendChild(card);
      });
    });
  }

  // ---- footer.summary ---------------------------------------------------
  if (nonEmpty(data.summary)) {
    var footer = el("footer", "summary");
    data.summary.forEach(function (s) {
      if (!s) return;
      var span = document.createElement("span");
      if (s.emoji) span.appendChild(document.createTextNode(s.emoji + " "));
      if (s.label != null) {
        var strong = el("strong");
        text(strong, s.label + ":");
        span.appendChild(strong);
      }
      if (s.value != null) {
        span.appendChild(document.createTextNode((s.label != null ? " " : "") + s.value));
      }
      footer.appendChild(span);
    });
    body.appendChild(footer);
  }

  // Attach the assembled <main> landmark to the document once.
  document.body.appendChild(body);

  // ---- file reference -> clickable vscode:// link -----------------------
  function fileLink(file) {
    var rel = file.relPath || file.absPath || "";
    var hasLine = file.line != null && file.line !== "";
    var visible = rel + (hasLine ? ":" + file.line : "");
    // No absPath means the payload was rendered with --no-abs, i.e. this page is
    // destined for a hosted viewer (issue #155 item 2). A vscode://file/ link
    // built from the RELATIVE path would not leak anything, but it is dead for
    // every viewer, so render the reference as plain text instead of a link.
    if (!file.absPath) {
      var span = el("span", "file-link");
      text(span, visible);
      return span;
    }
    var a = el("a", "file-link");
    a.setAttribute("href", "vscode://file/" + file.absPath + (hasLine ? ":" + file.line : ""));
    text(a, visible);
    return a;
  }
})();
</script>

</body>
</html>
